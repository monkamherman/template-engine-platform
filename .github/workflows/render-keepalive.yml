name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping production health endpoint
        run: |
          curl --fail --show-error --silent --max-time 20 \
            https://template-engine-platform-co.onrender.com/api/health
